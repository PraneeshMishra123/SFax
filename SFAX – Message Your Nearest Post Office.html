<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFAX – Message Your Nearest Post Office</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#222;--mute:#6b6b6b;--red:#c8102e;--blue:#1a4b8c;--line:#e6dfd2;--ok:#1b7a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181614;--card:#24211e;--ink:#f1ece4;--mute:#a09a90;--line:#3a352f;--red:#ef4a63;--blue:#6aa2f0;--ok:#5fcf86}}
:root[data-theme="dark"]{--bg:#181614;--card:#24211e;--ink:#f1ece4;--mute:#a09a90;--line:#3a352f;--red:#ef4a63;--blue:#6aa2f0;--ok:#5fcf86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{background:var(--red);color:#fff;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.choice{display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.choice b{display:block;font-size:1.15rem}.choice span{color:var(--mute);font-size:.9rem}
.choice.s{border-left:6px solid var(--red)}.choice.p{border-left:6px solid var(--blue)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{margin-top:16px;padding:12px 18px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:1rem;cursor:pointer;width:100%}
.btn.po{background:var(--blue)}
.btn.sm{width:auto;margin:0;padding:8px 14px;font-size:.9rem}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.name{font-weight:600}
.msg{margin-top:12px;font-size:.92rem}.ok{color:var(--ok)}.err{color:var(--red)}.mute{color:var(--mute);font-size:.9rem}
.badge{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}.badge.done{background:var(--ok);color:#fff;border-color:var(--ok)}.badge.wait{color:var(--mute)}
h2,h3{margin:0 0 4px}h3{margin-top:20px;font-size:1rem}
.hide{display:none}
#printArea{display:none}
@page{margin:8mm}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;margin:0;padding:0;background:#fff;color:#000;font-family:"Courier New",Courier,monospace;font-size:12pt;line-height:1.3}#printArea pre{margin:0;white-space:pre-wrap;word-break:break-word;max-width:80ch;font:inherit}}
</style>
</head>
<body>
<header><h1>📮 SFAX</h1><p>Send a message to your nearest post office</p></header>
<main>

<section id="home">
<button class="card choice s" onclick="openAuth('s')"><b>📨 Sender Login</b><span>Send messages to a post office and track if they were printed</span></button>
<button class="card choice p" onclick="openAuth('p')"><b>🏤 Post Office Login</b><span>View incoming senders and print their messages</span></button>
<div id="dberr" class="msg"></div>
</section>

<section id="sAuth" class="card hide">
<div class="top"><h2>📨 Sender <span id="sTitle">Login</span></h2><button class="link" onclick="view('home')">← Back</button></div>
<div id="sNameBox" class="hide"><label for="sn">Your name</label><input id="sn" autocomplete="name"></div>
<label for="se">Email ID</label><input id="se" type="email" autocomplete="email">
<label for="sp">Password</label><input id="sp" type="password" autocomplete="current-password">
<button class="btn" onclick="senderAuth()" id="sGo">Login</button>
<button class="link" onclick="toggle('s')" id="sTog">New sender? Register</button>
<div id="sErr" class="msg"></div>
</section>

<section id="pAuth" class="card hide">
<div class="top"><h2>🏤 Post Office <span id="pTitle">Login</span></h2><button class="link" onclick="view('home')">← Back</button></div>
<label for="pc">Post office code</label><input id="pc" placeholder="e.g. 500001">
<label for="pp">Password</label><input id="pp" type="password" autocomplete="current-password">
<button class="btn po" onclick="poAuth()" id="pGo">Login</button>
<button class="link" onclick="toggle('p')" id="pTog">New post office? Register</button>
<div id="pErr" class="msg"></div>
</section>

<section id="sApp" class="hide">
<div class="card">
<div class="top"><h2 id="sHi"></h2><button class="link" onclick="logout()">Logout</button></div>
<label for="c">Nearest post office code</label><input id="c" placeholder="e.g. 500001">
<label for="m">Message</label><textarea id="m" placeholder="Type your message"></textarea>
<button class="btn" onclick="sendMsg()">Send Message</button>
<div id="sres" class="msg"></div>
</div>
<div class="card"><h3 style="margin-top:0">My messages</h3><div id="mine"></div></div>
</section>

<section id="pApp" class="hide">
<div class="card">
<div class="top"><h2 id="pHi"></h2><button class="link" onclick="logout()">Logout</button></div>
<p class="mute" style="margin:0 0 8px">Incoming messages</p>
<div id="inbox"></div>
</div>
</section>
</main>
<div id="printArea"></div>

<script>
let db=null,unsub=null,cache={},sUser=null,pUser=null,mode={s:"login",p:"login"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
function view(v){["home","sAuth","pAuth","sApp","pApp"].forEach(x=>$(x).classList.toggle("hide",x!==v))}
/* Storage: uses claude.ai shared database when published there; otherwise falls back to this browser's localStorage (works offline, one computer). */
const LS="sfax_db",listeners=new Set();
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}};
const save=d=>localStorage.setItem(LS,JSON.stringify(d));
const notify=()=>listeners.forEach(f=>f());
window.addEventListener("storage",e=>{if(e.key===LS)notify()});
const snapDoc=(id,d)=>({id,exists:d!==undefined,data:()=>d});
const docRef=(col,id)=>({id,
 async get(){return snapDoc(id,(load()[col]||{})[id])},
 async set(v){const d=load();(d[col]=d[col]||{})[id]=v;save(d);notify()},
 async update(v){const d=load(),o=(d[col]||{})[id];if(!o)throw{code:"not_found",message:"Record not found"};d[col][id]={...o,...v};save(d);notify()}});
const query=(col,fl)=>({
 where:(f,op,v)=>query(col,[...fl,[f,v]]),
 onSnapshot(next){const run=()=>next({docs:Object.entries(load()[col]||{}).filter(([k,o])=>fl.every(([f,v])=>o[f]===v)).map(([k,o])=>snapDoc(k,o))});listeners.add(run);run();return()=>listeners.delete(run)}});
const localDb={collection:col=>({...query(col,[]),doc:id=>docRef(col,id),async add(v){const id=Math.random().toString(36).slice(2)+Date.now().toString(36);await docRef(col,id).set(v);return docRef(col,id)}})};
(async()=>{try{db=await claude.use("db")}catch(e){db=null}
if(!db){db=localDb;$("dberr").innerHTML='<span class="mute">Demo mode: data is stored in this browser only.</span>'}})();

function openAuth(r){mode[r]="login";setMode(r);["sErr","pErr"].forEach(i=>$(i).textContent="");view(r+"Auth")}
function toggle(r){mode[r]=mode[r]==="login"?"reg":"login";setMode(r)}
function setMode(r){const reg=mode[r]==="reg";
 $(r+"Title").textContent=reg?"Register":"Login";$(r+"Go").textContent=reg?"Create account":"Login";
 $(r+"Tog").textContent=reg?"Already registered? Login":(r==="s"?"New sender? Register":"New post office? Register");
 if(r==="s")$("sNameBox").classList.toggle("hide",!reg)}

async function senderAuth(){
 const e=$("se").value.trim().toLowerCase(),p=$("sp").value,n=$("sn").value.trim(),err=$("sErr");
 if(!/^\S+@\S+\.\S+$/.test(e)||p.length<4){err.innerHTML='<span class="err">Enter a valid email and a password (min 4 characters).</span>';return}
 if(!db){err.innerHTML='<span class="err">Not ready yet, please try again.</span>';return}
 try{
  const ref=db.collection("senders").doc(await sha(e)),snap=await ref.get(),h=await sha(e+":"+p);
  if(mode.s==="reg"){
   if(!n){err.innerHTML='<span class="err">Enter your name.</span>';return}
   if(snap.exists){err.innerHTML='<span class="err">This email is already registered. Please login.</span>';return}
   await ref.set({name:n,email:e,hash:h});sUser={name:n,email:e};
  }else{
   if(!snap.exists||snap.data().hash!==h){err.innerHTML='<span class="err">Wrong email or password.</span>';return}
   sUser={name:snap.data().name,email:e};
  }
  $("sp").value="";enterSender();
 }catch(x){err.innerHTML='<span class="err">'+esc(x.message||x.code)+'</span>'}
}

async function poAuth(){
 const c=$("pc").value.trim(),p=$("pp").value,err=$("pErr");
 if(!/^[A-Za-z0-9]{3,10}$/.test(c)||p.length<4){err.innerHTML='<span class="err">Enter a valid post office code and a password (min 4 characters).</span>';return}
 if(!db){err.innerHTML='<span class="err">Not ready yet, please try again.</span>';return}
 try{
  const ref=db.collection("postoffices").doc("po"+c),snap=await ref.get(),h=await sha(c+":"+p);
  if(mode.p==="reg"){
   if(snap.exists){err.innerHTML='<span class="err">This post office code is already registered. Please login.</span>';return}
   await ref.set({code:c,hash:h});
  }else if(!snap.exists||snap.data().hash!==h){err.innerHTML='<span class="err">Wrong code or password.</span>';return}
  pUser={code:c};$("pp").value="";enterPO();
 }catch(x){err.innerHTML='<span class="err">'+esc(x.message||x.code)+'</span>'}
}

function enterSender(){
 $("sHi").textContent="Hello, "+sUser.name;$("sres").textContent="";view("sApp");
 if(unsub)unsub();
 unsub=db.collection("messages").where("email","==",sUser.email).onSnapshot(s=>{
  const items=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);
  $("mine").innerHTML=items.length?items.map(i=>'<div class="row"><span><span class="name">To '+esc(i.code)+'</span><br><span class="mute">'+esc(i.message.length>60?i.message.slice(0,60)+'…':i.message)+'</span></span>'+(i.printed?'<span class="badge done">✔ Printed</span>':'<span class="badge wait">Pending</span>')+'</div>').join(""):'<p class="mute">No messages sent yet.</p>';
 },e=>{$("mine").innerHTML='<span class="err">'+esc(e.message||e.code)+'</span>'});
}

async function sendMsg(){
 const r=$("sres"),code=$("c").value.trim(),msg=$("m").value.trim();
 if(!code||!msg){r.innerHTML='<span class="err">Enter the post office code and a message.</span>';return}
 try{await db.collection("messages").add({name:sUser.name,email:sUser.email,code,message:msg,at:Date.now()});
  r.innerHTML='<span class="ok">✔ Message sent to post office '+esc(code)+'.</span>';$("m").value=""}
 catch(e){r.innerHTML='<span class="err">Could not send: '+esc(e.message||e.code)+'</span>'}
}

function enterPO(){
 $("pHi").textContent="Post Office "+pUser.code;view("pApp");
 if(unsub)unsub();
 unsub=db.collection("messages").where("code","==",pUser.code).onSnapshot(s=>{
  cache={};
  const items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);
  items.forEach(i=>cache[i.id]=i);
  $("inbox").innerHTML=items.length?items.map(i=>'<div class="row"><span class="name">'+esc(i.name)+(i.printed?' <span class="badge done">Printed</span>':'')+'</span><button class="btn sm po" onclick="printMsg(\''+esc(i.id)+'\')">🖨 Print</button></div>').join(""):'<p class="mute">No messages yet.</p>';
 },e=>{$("inbox").innerHTML='<span class="err">'+esc(e.message||e.code)+'</span>'});
}

function printMsg(id){
 const i=cache[id];if(!i)return;
 const line="-".repeat(40);
 const txt=["MESSAGE FROM: "+i.name,line,i.message,line,"POST OFFICE CODE: "+i.code,"SENDER EMAIL: "+i.email,"DATE: "+new Date(i.at).toLocaleString()].join("\n");
 $("printArea").innerHTML="<pre>"+esc(txt)+"</pre>";
 window.print();
 if(!i.printed&&db)db.collection("messages").doc(id).update({printed:true,printedAt:Date.now()}).catch(()=>{});
}

function logout(){if(unsub)unsub();unsub=null;sUser=pUser=null;view("home")}
</script>
</body>
</html>
